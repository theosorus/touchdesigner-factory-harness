# Registry of reusable components.
#
# This file ships EMPTY on purpose. The registry is the mechanism; its contents are
# yours. A component lands here only once it has shipped in a project, is generic, and
# is parameterized with no hardcoded values.
#
# The Builder reads this file before creating anything, and adds an entry whenever it
# capitalizes a component into lib/components/. That is what makes the tenth project an
# assembly job rather than a rebuild.

version: 1
components: []

# Expected shape of an entry:
#
# - id: feedback_trails                  # matches the file name
#   file: components/feedback_trails.tdxn
#   family: TOP                          # TOP, CHOP, SOP, POP, MAT, COMP
#   summary: one line, what it does and what it is for
#   params: [Persistence]                # what it exposes
#   inputs: 1
#   outputs: 1
#   cost_gpu_ms: 0.3                     # measured, not guessed
#   tested_on: '2025.33070'              # the TD build it was verified on
#   born_in: projects/<slug>
#   caveats: >
#     what bites when reusing it: required references, resolution behaviour, blending
#     assumptions
