# Error memory. Shared by every agent and every harness working in this repo.
#
# This file ships EMPTY on purpose: it is your project's memory, not someone else's.
# An entry lands here only when the root cause is identified and the fix is verified.
# Full protocol: .claude/skills/td-auto-improve/SKILL.md
#
# Read: grep the tags before a build, grep the exact error message when one hits.
# Write: dedupe first, update an existing entry rather than duplicating it.
#
# knowledge/lessons.field-tested.yaml holds a handful of TouchDesigner gotchas met in
# production. Adopt the ones you want by copying them in here, or ignore the file.

lessons: []

# Expected shape of an entry:
#
# - id: pop-attribute-copy-cook          # short, stable, kebab-case
#   date: 2026-09-08
#   hits: 1                              # increment instead of duplicating
#   context: which project, which stage
#   symptom: >
#     exact error text or observable behaviour, verbatim so grep matches
#   cause: >
#     identified root cause, not a workaround that happened to work
#   fix: >
#     what fixed it, and how it was verified (capture, measurement, empty get_op_errors)
#   prevention: what to do next time so you never meet it
#   tags: [pop, attribute, cook]
#   source: which agent or harness wrote this
